apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: extsonomy
namePrefix: PREVIEW_NAME_PREFIX

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/component: preview
      preview.bibsonomy.org/branch: PREVIEW_BRANCH
      preview.bibsonomy.org/pr: "PREVIEW_PR"
      preview.bibsonomy.org/db-mode: biblicious

patches:
  - path: rest-api-secret-patch.yaml
  - path: rest-api-cors-patch.yaml
  - path: rest-api-image-patch.yaml
  - path: webapp-image-patch.yaml
  - path: webapp-api-upstream-patch.yaml
  - path: rest-api-selector-patch.yaml
  - path: webapp-selector-patch.yaml
  - path: rest-api-service-selector-patch.yaml
  - path: webapp-service-selector-patch.yaml
patchesJson6902:
  - target:
      version: v1
      kind: Service
      name: bibsonomy-rest-api-v2
    path: rest-api-nodeport-remove.yaml
  - target:
      version: v1
      kind: Service
      name: bibsonomy-webapp-v2
    path: webapp-nodeport-remove.yaml
