project.home = http://localhost:31415/

# embedded Tomcat 7 test runtime does not provide tomcat-dbcp2 classes
database.datasource.class = org.apache.commons.dbcp2.BasicDataSource

# database settings
# main database
database.main.url = ${webapp-test.main.url}
database.main.username = ${webapp-test.username}
database.main.password = ${webapp-test.password}

# tag recommender database
database.recommender.tag.url = ${webapp-test.tagrecommender.url}
database.recommender.tag.username = ${webapp-test.username}
database.recommender.tag.password = ${webapp-test.password}

# item recommender database
database.recommender.item.url = ${webapp-test.itemrecommender.url}
database.recommender.item.username = ${webapp-test.username}
database.recommender.item.password = ${webapp-test.password}


# opensocial database
database.opensocial.url = ${webapp-test.opensocial.url}
database.opensocial.username = ${webapp-test.username}
database.opensocial.password = ${webapp-test.password}
