name: Java 21 CI

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
      - "feature/**"
  pull_request:

jobs:
  test-suite-java21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run GitLab-style local CI test suite
        run: |
          chmod +x misc/scripts/run_ci_tests_local.sh
          mkdir -p target
          ./misc/scripts/run_ci_tests_local.sh | tee target/ci-test.log

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java21-test-artifacts
          path: |
            target/ci-test.log
            target/surefire-reports/**/*.xml
            bibsonomy-*/target/surefire-reports/**/*.xml
            coverage/target/site/**
            target/site/jacoco-aggregate/**

  webapp-package-java21:
    runs-on: ubuntu-latest
    needs: test-suite-java21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build webapp with Java 21
        run: mvn -B -pl bibsonomy-webapp -am -DskipTests clean package
